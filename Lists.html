<!--USING THE ORDER,UNORDER LISTS IN THE HTML-->
<!doctype html>
<html>
  <head>
    <title>Lists Of The HTML</title>
  </head>
  <body>
    <h1><i>Order List</i></h1>
    <ol>
      <li>Items</li>
      <li>Mango</li>
      <li>Apple</li>
      <li>Bannana</li>
      <li>Pineapple</li>
      <li>Orange</li>
      <li>Pikle</li>
      <li>Lemon</li>
    </ol>
    <h1>
      <i>UnOrder List</i>
    </h1>
    <ul>
      <li>Items1</li>
      <li>Mango</li>
      <li>Apple</li>
      <li>Bannana</li>
      <li>Pineapple</li>
      <li>Orange</li>
      <li>Pikle</li>
      <li>Lemon</li>
    </ul>
  </body>
</html>
