<!--USING THE ORDER,UNORDER LISTS IN THE HTML-->
<!DOCTYPE html>
<html>
  <head>
    <title>Lists Of the HTML</title>
  </head>
  <body>
    <h1>Order List</h1>
    <ol>
      <li>Items</li>
      <li>Mango</li>
      <li>Apple</li>
      <li>Bannana</li>
      <li>Pineapple</li>  
      <li>Orange</li>
      <li>Pikle</li>
      <li>Lemon</li>
    </ol>
    <h1>UnOrder List</h1>
    <ul>
      <li>Items1</li>
      <li>Mango</li>
      <li>Apple</li>
      <li>Bannana</li>
      <li>Pineapple</li>
      <li>Orange</li>
      <li>Pikle</li>
      <li>Lemon</li>
    </ul>
  </body>
</html>
